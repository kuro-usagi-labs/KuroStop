name: KuroStop CI & iOS IPA Builder

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Validation & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type-check
        run: npx tsc --noEmit

      - name: Execute automated unit test suite
        run: npm test

  build-ios-ipa:
    name: Build iOS IPA Package
    needs: validate-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      - name: Generate native iOS project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Archive iOS Release
        run: |
          xcodebuild -workspace ios/kurostop.xcworkspace \
            -scheme kurostop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KuroStop.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/KuroStop.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qry KuroStop.ipa Payload
          cd ..
          ls -lh build/KuroStop.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroStop-iOS-IPA
          path: build/KuroStop.ipa
          retention-days: 14
